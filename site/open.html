<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Freekick Battle openen</title><style>html,body{margin:0;background:#fff;color:#132138;font-family:Arial,sans-serif}main{max-width:440px;margin:50px auto;padding:24px}h1{font-size:30px}p{line-height:1.7;font-size:17px}a{display:inline-block;padding:16px 24px;background:#205ed9;color:#fff;text-decoration:none;border-radius:10px;font-size:19px;font-weight:bold}small{display:block;margin-top:20px;color:#52647b;line-height:1.6}#status{min-height:30px}</style></head><body><main><h1>Freekick Battle</h1><p>Tik op de knop om het spel met een verse spelcache te openen. Je opgeslagen voortgang blijft behouden.</p><a id="open-game" href="./index.html?repair=3">Start het spel</a><p id="status" role="status"></p><small>Open deze pagina in Safari. Draai je iPhone horizontaal voor een groter speelveld.</small><noscript><p>JavaScript is uitgeschakeld. Het spel heeft JavaScript nodig om te starten.</p></noscript></main><script>
(function(){var link=document.getElementById('open-game');link.onclick=function(event){event.preventDefault();document.getElementById('status').textContent='Het spel wordt opnieuw geopend…';var moved=false;function go(){if(moved)return;moved=true;window.location.replace('./index.html?repair='+Date.now());}setTimeout(go,3000);var tasks=[];try{if('serviceWorker'in navigator)tasks.push(navigator.serviceWorker.getRegistrations().then(function(list){return Promise.all(list.filter(function(reg){return reg.scope.indexOf(window.location.origin+'/freekickbattle/')===0;}).map(function(reg){return reg.unregister();}));}).catch(function(){}));if('caches'in window)tasks.push(caches.keys().then(function(keys){return Promise.all(keys.filter(function(key){return key.indexOf('freekick-')===0;}).map(function(key){return caches.delete(key);}));}).catch(function(){}));Promise.all(tasks).then(go,go);}catch(error){go();}};}());
</script></body></html>
